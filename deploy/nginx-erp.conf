# ERP Manoha Énergie — front Angular (fichiers statiques).
# Servi en HTTP sur le port 80 de la VM ; le TLS est assuré par le tunnel Cloudflare
# (erp.manoha-energie.online → http://<ip-de-la-vm>:80).

server {
    listen 80;
    listen [::]:80;
    server_name erp.manoha-energie.online _;

    root /var/www/erp-manoha;
    index index.html;

    # Le tunnel Cloudflare transmet l'IP réelle du visiteur.
    real_ip_header CF-Connecting-IP;

    # Fichiers avec empreinte (main-XXXX.js, styles-XXXX.css, media/) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header dans un bloc location annule ceux du serveur : on les répète.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        # add_header dans un bloc location annule ceux du serveur : on les répète.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # index.html jamais mis en cache : une mise à jour est vue immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # add_header dans un bloc location annule ceux du serveur : on les répète.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Routes Angular (/vente/factures, /suivi-gps…) : renvoyer l'application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
